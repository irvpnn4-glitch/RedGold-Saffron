<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Page</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto; margin:0; padding:24px; background:#0b0b0f; color:#fff;}
    .card{max-width:520px; margin:0 auto; background:#151522; border:1px solid #2a2a3d; border-radius:16px; padding:18px;}
    h1{font-size:18px; margin:0 0 12px;}
    p{opacity:.85; margin:0 0 12px; font-size:14px; line-height:1.5;}
    textarea{width:100%; min-height:110px; resize:vertical; border-radius:12px; border:1px solid #2a2a3d; padding:12px; background:#0f0f18; color:#fff; font-size:13px;}
    .row{display:flex; gap:10px; margin-top:10px;}
    button{flex:1; padding:12px; border-radius:12px; border:1px solid #2a2a3d; background:#2b67ff; color:#fff; font-weight:600;}
    button.secondary{background:#0f0f18;}
    .qrWrap{margin-top:16px; display:flex; justify-content:center; padding:16px; background:#0f0f18; border:1px dashed #2a2a3d; border-radius:16px;}
    .hint{margin-top:10px; font-size:12px; opacity:.75; word-break:break-all;}
  </style>
</head>
<body>
  <div class="card">
    <h1>QR Generator</h1>
    <p>متن یا لینک خودت رو اینجا بذار، بعد روی <b>Generate QR</b> بزن.</p>

    <textarea id="txt" placeholder="Paste your text / URL here..."></textarea>

    <div class="row">
      <button id="gen">Generate QR</button>
      <button class="secondary" id="copy">Copy</button>
    </div>

    <div class="qrWrap">
      <canvas id="qrcanvas"></canvas>
    </div>

    <div class="hint" id="status">Ready.</div>
  </div>

  <!-- QR library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const txt = document.getElementById("txt");
    const canvas = document.getElementById("qrcanvas");
    const status = document.getElementById("status");

    function makeQR() {
      const value = txt.value.trim();
      if (!value) {
        status.textContent = "Please paste something first.";
        return;
      }
      status.textContent = "Generating...";
      QRCode.toCanvas(canvas, value, { width: 280, margin: 2 }, function (err) {
        status.textContent = err ? ("Error: " + err) : "Done ✅";
      });
    }

    document.getElementById("gen").addEventListener("click", makeQR);

    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(txt.value);
        status.textContent = "Copied ✅";
      } catch (e) {
        status.textContent = "Copy failed (browser blocked clipboard).";
      }
    });

    // Optional: auto-generate if you prefill text
    // txt.value = "https://example.com";
    // makeQR();
  </script>
</body>
</html>
