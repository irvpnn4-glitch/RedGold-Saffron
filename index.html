<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Site</title>
  <style>
    :root { --bg:#0b1020; --card:#121a33; --text:#e8ecff; --muted:#9aa6d6; --accent:#6aa7ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1c2a6a 0%, var(--bg) 50%, #070a14 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
    }
    .row { display: flex; gap: 14px; align-items: center; }
    .avatar {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #ff7a7a, #ffd36a, #6aa7ff);
      display: grid; place-items: center;
      font-weight: 800; color: #081026;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
    p { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
    .grid { display: grid; gap: 12px; margin-top: 18px; }
    a.btn {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 14px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    a.btn:hover { transform: translateY(-1px); border-color: rgba(106,167,255,.45); background: rgba(106,167,255,.10); }
    .label { font-weight: 600; }
    .hint { font-size: 12px; color: rgba(232,236,255,.65); }
    footer { margin-top: 14px; font-size: 12px; color: rgba(232,236,255,.55); text-align: center; }
    .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 6px rgba(106,167,255,.15); }
  </style>
</head>
<body>
  <main class="card">
    <div class="row">
      <div class="avatar">CS</div>
      <div>
        <h1>Card Site</h1>
        <p>A simple one-page card site (GitHub + Cloudflare ready).</p>
      </div>
      <div style="margin-left:auto" class="dot" title="Online"></div>
    </div>

    <div class="grid">
      <a class="btn" href="#" onclick="alert('Link 1 clicked!'); return false;">
        <span class="label">Button / Link 1</span>
        <span class="hint">Tap</span>
      </a>
      <a class="btn" href="#" onclick="alert('Link 2 clicked!'); return false;">
        <span class="label">Button / Link 2</span>
        <span class="hint">Tap</span>
      </a>
      <a class="btn" href="#" onclick="alert('Link 3 clicked!'); return false;">
        <span class="label">Button / Link 3</span>
        <span class="hint">Tap</span>
      </a>
    </div>

    <footer>
      Edit this file to change title, text, and buttons.
    </footer>
  </main>
</body>
</html>
